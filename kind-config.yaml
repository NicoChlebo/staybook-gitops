# Cluster kind pour le TP 2 Argo CD / StayBook : un cluster, deux environnements
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argocd-tp
nodes:
  - role: control-plane
    image: kindest/node:v1.30.0
    extraPortMappings:
      - containerPort: 30080   # Argo CD (interface web, HTTP)
        hostPort: 8085
        protocol: TCP
      - containerPort: 30081   # StayBook dev (front)
        hostPort: 8081
        protocol: TCP
      - containerPort: 30082   # StayBook prod (front)
        hostPort: 8082
        protocol: TCP
