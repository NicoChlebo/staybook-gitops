# Installation d'Argo CD "méthode manifests", personnalisée avec Kustomize.
# Commande : kubectl apply -k argocd-install --server-side
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/install.yaml
patches:
  - path: argocd-cmd-params.yaml
  - path: argocd-server-nodeport.yaml
    target:
      kind: Service
      name: argocd-server
