# Base vectorielle du concierge
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
      targetPort: 6333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.10.1
          ports:
            - containerPort: 6333
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
