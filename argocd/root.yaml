# L'Application racine (« App of Apps ») : le SEUL objet appliqué à la main, une fois.
# Elle déploie tout ce qui se trouve dans argocd/apps/ : les AppProjects et les Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/NicoChlebo/staybook-gitops.git   # À COMPLÉTER
    targetRevision: HEAD
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
