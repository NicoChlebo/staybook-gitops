apiVersion: v1
kind: Service
metadata:
  name: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: staybook-gateway:v1
          ports:
            - containerPort: 3000
          env:
            - name: HOTELS_URL
              value: "http://hotels-service:3001"
            - name: RESERVATIONS_URL
              value: "http://reservations-service:3002"
            - name: RAG_URL      # le concierge est partagé, dans son propre namespace : nom DNS complet
              value: "http://rag-service.concierge.svc.cluster.local:3003"
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
